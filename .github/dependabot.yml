version: 2
updates:
  # Root Go module
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "go"]
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # pkg/* Go modules
  - package-ecosystem: gomod
    directory: /pkg/agent
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "go"]
    groups:
      go-minor-patch:
        update-types: [minor, patch]

