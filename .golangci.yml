version: "2"

run:
  timeout: 5m
  concurrency: 4

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign

  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
