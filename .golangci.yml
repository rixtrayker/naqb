version: "2"

run:
  timeout: 5m
  concurrency: 4

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nolintlint
    - sqlclosecheck
    - unconvert
    - wastedassign
  disable:
    # Temporarily disabled due to high volume of legacy issues.
    # Re-enable incrementally: see docs/gap-closure-plan.md S1.2
    - errcheck
    - gocritic
    - ineffassign
    - staticcheck
    - unparam
    - unused

  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
